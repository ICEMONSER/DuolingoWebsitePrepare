<style>
  :root{

    --green-darker:#3c9302;

    --ink-light:#777;

    --radius:16px;

  }
  *{box-sizing:border-box;}
  body{

    color:var(--ink);

  }
  #app{max-width:900px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,0.05);position:relative;}

  /* ---------- HEADER / TOPBAR ---------- */

    font-weight:800;font-size:16px;color:var(--ink);
    background:var(--bg-soft);border:2px solid var(--line);
    padding:6px 14px;border-radius:99px;min-width:78px;text-align:center;
  }.timer.low{color:var(--red);border-color:var(--red);}

  /* ---------- MENU ---------- */
  .menu{padding:32px 24px 60px;}.menu h1{font-size:28px;font-weight:900;margin:0 0 4px;}.menu p.sub{color:var(--ink-light);margin:0 0 28px;font-size:15px;}.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}.qcard{
    border:2px solid var(--line);border-radius:var(--radius);padding:18px;
    cursor:pointer;transition:all .15s ease;background:var(--bg);position:relative;
  }.qcard:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:var(--shadow);}.qcard .qnum{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50%;background:#e5f8d3;color:var(--green-dark);
    font-weight:900;margin-bottom:10px;
  }.qcard h3{margin:0 0 4px;font-size:16px;}.qcard .score-badge{
    position:absolute;top:14px;right:14px;font-size:12px;font-weight:800;
    padding:4px 10px;border-radius:99px;background:var(--green);color:#fff;
  }.start-all-btn{margin-top:26px;}.summary-box{
    margin-top:24px;padding:18px;border-radius:var(--radius);
    background:#e5f8d3;border:2px solid var(--green);display:none;
  }.summary-box.show{display:block;}
  .notice-box{
    margin:0 0 26px;padding:16px 20px;border-radius:var(--radius);
    background:#fffaeb;border:2px solid var(--yellow);
  }
  .notice-box .notice-title{
    display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;
    color:#8a6d00;margin-bottom:10px;
  }
  .notice-box ul{margin:0 0 10px;padding-left:20px;}
  .notice-box li{font-size:13.5px;line-height:1.7;color:#5c4a00;margin-bottom:4px;}
  .notice-box .notice-tip{
    font-size:13.5px;line-height:1.7;color:#3c3c3c;background:#fff;
    border-radius:10px;padding:10px 14px;margin-top:8px;border:1px dashed var(--yellow);
  }

  /* ---------- BUTTONS ---------- */
  .btn{
    font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:14px;
    padding:14px 26px;cursor:pointer;transition:transform .08s ease, filter .15s ease;

  /* ---------- STEP LAYOUT ---------- */
  .step{padding:28px 26px 120px;}.step-kicker{color:var(--green-dark);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}.step-title{font-size:22px;font-weight:900;margin:0 0 18px;}.instructions{background:#eef8ff;border:2px solid #bfe8fc;color:#0a6ea3;padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:20px;}.passage{
    font-size:17px;line-height:1.9;background:var(--bg-soft);
    padding:20px 22px;border-radius:var(--radius);border:2px solid var(--line);

  /* dropdown blanks */
  .blank-wrap{position:relative;display:inline-block;margin:0 2px;}.blank-btn{
    display:inline-block;min-width:70px;padding:2px 10px;border-radius:8px;
    border:2px dashed var(--blue);color:var(--blue);font-weight:700;background:#eef8ff;
    cursor:pointer;text-align:center;

    position:absolute;top:110%;left:0;background:#fff;border:2px solid var(--line);
    border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:30;min-width:160px;

  /* choice list (insert sentence / idea / title) */
  .choice-list{display:flex;flex-direction:column;gap:12px;margin-top:18px;}.choice{
    border:2px solid var(--line);border-radius:14px;padding:14px 18px;
    cursor:pointer;font-size:15px;line-height:1.5;transition:all .12s ease;
  }.choice:hover{border-color:var(--blue);background:#f4fbff;}.choice.selected{border-color:var(--blue);background:#eef8ff;}.choice.correct{border-color:var(--green);background:#e5f8d3;}.choice.incorrect{border-color:var(--red);background:#ffe9e9;}

  /* passage split for step2 */
  .split-passage{font-size:16px;line-height:1.85;}.split-passage .p1{background:var(--bg-soft);padding:16px 18px;border-radius:12px;border:2px solid var(--line);}.insert-slot{
    margin:10px 0;padding:12px 16px;border:2px dashed var(--blue);border-radius:12px;
    color:var(--blue);font-weight:700;text-align:center;background:#eef8ff;min-height:20px;
  }.split-passage .p2{background:var(--bg-soft);padding:16px 18px;border-radius:12px;border:2px solid var(--line);margin-top:10px;}

  /* footer action bar */
  .action-bar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:900px;
    background:#fff;border-top:2px solid var(--line);padding:16px 26px;
    display:flex;justify-content:flex-end;gap:12px;z-index:15;
  }

  /* ---------- RESULT PAGE ---------- */
  .result{padding:32px 26px 60px;}.result-hero{
    text-align:center;padding:26px;border-radius:var(--radius);
    background:linear-gradient(135deg,#e5f8d3,#d6f5b8);margin-bottom:26px;
  }.result-hero .score{font-size:52px;font-weight:900;color:var(--green-dark);}.result-hero .label{color:var(--ink-light);font-weight:700;}.review-item{border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;}.review-item.ok{border-color:var(--green);}.review-item.bad{border-color:var(--red);}.review-item .tag{

  .explain-toggle{
    background:none;border:none;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;gap:4px;color:var(--red);font-weight:800;font-size:13px;
    padding:4px 8px;border-radius:8px;
  }
  .explain-toggle:hover{background:#ffe9e9;}
  .explain-arrow{display:inline-block;transition:transform .2s ease;font-size:12px;}
  .explain-arrow.open{transform:rotate(180deg);}
  .explain-box{
    display:none;margin-top:10px;padding:12px 14px;background:#fff5f5;

  @media(max-width:640px){
    .step{padding:20px 16px 120px;}.menu{padding:20px 16px 60px;}.action-bar{padding:12px 16px;}
  }
</style>

   STATE
   ============================================================ */
const STATE = {
  screen:'menu',        // 'menu' | 'step' | 'result'
  qIndex:0,              // index into QUESTIONS
  step:1,                // 1..6
  timeLeft:8*60,
  timerHandle:null,
  answers:{},             // per question id -> answer data
  results:{}              // per question id -> {score, items:[...]}
};
function freshAnswers(){
  return { blanks:[], insertChoice:null, hl3:'', hl4:'', idea:null, title:null };
}

const TOTAL_STEPS = 6;

/* ============================================================
   HELPERS
   ============================================================ */
function normText(s){
  return (s||'').toLowerCase().replace(/[.,;:!?"']/g,'').replace(/\s+/g,' ').trim();
}
function overlapScore(a,b){
  const an=normText(a), bn=normText(b);
  if(!an || !bn) return 0;
  if(an.includes(bn) || bn.includes(an)) return 1;
  const aw=new Set(an.split(' ')), bw=new Set(bn.split(' '));
  let inter=0; aw.forEach(w=>{if(bw.has(w)) inter++;});
  const union=new Set([...aw,...bw]).size;
  return union? inter/union : 0;
}
function isHighlightCorrect(userText, correctText){
  return overlapScore(userText, correctText) >= 0.5;
}
function fmtTime(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function el(html){
  const t=document.createElement('template');
  t.innerHTML=html.trim();
  return t.content.firstElementChild;
}

let SEQUENCE_MODE = false;

function startQuestion(index, sequenceMode){
  SEQUENCE_MODE = sequenceMode;
  STATE.qIndex = index;
  STATE.step = 1;
  STATE.answers[QUESTIONS[index].id] = freshAnswers();
  STATE.timeLeft = 8*60;
  STATE.screen='step';
  startTimer();
  renderStep();
}

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(){
  clearTimer();
  updateTimerUI();
  STATE.timerHandle = setInterval(()=>{
    STATE.timeLeft--;
    if(STATE.timeLeft<=0){
      STATE.timeLeft=0;
      updateTimerUI();
      clearTimer();
      finishQuestion();
      return;
    }
    updateTimerUI();
  },1000);
}
function clearTimer(){
  if(STATE.timerHandle){ clearInterval(STATE.timerHandle); STATE.timerHandle=null; }
}
function updateTimerUI(){
  const t=document.getElementById('timerDisplay');
  if(!t) return;
  t.textContent = fmtTime(STATE.timeLeft);
  t.classList.toggle('low', STATE.timeLeft<=60);
}

/* ============================================================
   RENDER: STEP (shared topbar)
   ============================================================ */
function topbarHTML(){
  const pct = Math.round((STATE.step-1)/TOTAL_STEPS*100);
  return `
    <div class="topbar">
      <div class="brand"><span class="owl">🦉</span>Q${QUESTIONS[STATE.qIndex].id}</div>
      <div class="progressbar-wrap"><div class="progressbar-fill" style="width:${pct}%"></div></div>
      <div class="timer" id="timerDisplay">${fmtTime(STATE.timeLeft)}</div>
    </div>
  `;
}

function renderStep(){
  const app=document.getElementById('app');
  const q = QUESTIONS[STATE.qIndex];
  let body = '';
  if(STATE.step===1) body = stepBlanksHTML(q);
  else if(STATE.step===2) body = stepInsertHTML(q);
  else if(STATE.step===3) body = stepHighlightHTML(q, 3);
  else if(STATE.step===4) body = stepHighlightHTML(q, 4);
  else if(STATE.step===5) body = stepMCHTML(q,'idea');
  else if(STATE.step===6) body = stepMCHTML(q,'title');

  app.innerHTML = topbarHTML() + `<div class="step" id="stepBody">${body}</div>`;
  updateTimerUI();
  wireStep(q);
}

/* ---- STEP 1: complete the sentences (hover-preview dropdown) ---- */
function stepBlanksHTML(q){
  const ans = STATE.answers[q.id];
  if(ans.blanks.length !== q.part1.blanks.length){
    ans.blanks = q.part1.blanks.map(()=>null);
  }
  let idx=0;
  const passageHTML = q.part1.template.replace(/\{(\d+)\}/g, ()=>{
    const i = idx++;
    const chosen = ans.blanks[i];
    const options = q.part1.blanks[i].options.map(o=>`<div class="blank-option" data-i="${i}" data-val="${o}">${o}</div>`).join('');
    return `<span class="blank-wrap" data-i="${i}">
      <span class="blank-btn ${chosen?'filled':''}" data-i="${i}">${chosen ? chosen : '_____'}</span>
      <div class="blank-dropdown" data-i="${i}">${options}</div>
    </span>`;
  });
  const allFilled = ans.blanks.every(b=>!!b);
  return `
    <div class="step-kicker">Step 1 of 6</div>
    <h2 class="step-title">Complete the Sentences</h2>
    <div class="instructions">คลิกที่ช่องว่างเพื่อเลือกคำตอบ — ลองเอาเมาส์ไปชี้ตัวเลือกก่อน คำตอบจะพรีวิวในช่องว่างทันที ต้องตอบให้ครบทุกช่องก่อนจึงจะไปขั้นตอนถัดไปได้</div>
    <div class="passage">${passageHTML}</div>
    <div class="action-bar">
      <button class="btn btn-primary" id="nextBtn" ${allFilled?'':'disabled'}>ถัดไป</button>
    </div>
  `;
}

/* ---- STEP 2: complete the passage (insert sentence) ---- */
function stepInsertHTML(q){
  const ans = STATE.answers[q.id];
  let idx=0;
  const filledPart1 = q.part1.template.replace(/\{(\d+)\}/g, ()=>{
    const i=idx++;
    return `<b>${q.part1.blanks[i].correct}</b>`;
  });
  const choices = q.insertOptions.map((o,i)=>`
    <div class="choice ${ans.insertChoice===i?'selected':''}" data-i="${i}">${o.text}</div>
  `).join('');
  return `
    <div class="step-kicker">Step 2 of 6</div>
    <h2 class="step-title">Complete the Passage</h2>
    <div class="instructions">เลือกประโยคที่เหมาะสมที่สุดเพื่อแทรกระหว่างสองย่อหน้า</div>
    <div class="split-passage">
      <div class="p1">${filledPart1}</div>
      <div class="insert-slot" id="insertSlot">[ เลือกประโยคที่จะแทรกตรงนี้ ]</div>
      <div class="p2">${q.part2}</div>
    </div>
    <div class="choice-list">${choices}</div>
    <div class="action-bar">
      <button class="btn btn-primary" id="nextBtn" ${ans.insertChoice===null?'disabled':''}>ถัดไป</button>
    </div>
  `;
}

/* ---- STEP 3 & 4: highlight the answer ---- */

function fullPassageText(q, ans){
  let idx=0;
  const p1 = q.part1.template.replace(/\{(\d+)\}/g, ()=>{
    const i=idx++;
    return q.part1.blanks[i].correct;
  });
  const insertCorrectIdx = q.insertOptions.findIndex(o=>o.correct);
  const insertText = q.insertOptions[insertCorrectIdx].text;
  return p1 + ' ' + insertText + ' ' + q.part2;
}

function stepHighlightHTML(q, stepNum){
  const ans = STATE.answers[q.id];
  const which = stepNum===3 ? 'hl3' : 'hl4';
  const qObj = q.highlightQs[stepNum===3?0:1];
  const passage = fullPassageText(q, ans);
  const current = ans[which];
  return `
    <div class="step-kicker">Step ${stepNum} of 6</div>
    <h2 class="step-title">Highlight the Answer</h2>
    <div class="instructions"><b>คำถาม:</b> ${qObj.question}<br>ใช้เมาส์ลากคลุมข้อความในบทความด้านล่างเพื่อเลือกคำตอบ</div>
    <div class="passage selectable" id="hlPassage" data-which="${which}">${passage}</div>
    <div style="margin-top:14px;font-size:14px;color:var(--ink-light);" id="hlStatus">
      ${current ? `คุณเลือกไว้: <b>"${current}"</b>` : 'ยังไม่ได้เลือกข้อความ'}
    </div>
    <div class="action-bar">
      <button class="btn btn-primary" id="nextBtn" ${current?'':'disabled'}>ถัดไป</button>
    </div>
  `;
}

/* ---- STEP 5 & 6: multiple choice ---- */
function stepMCHTML(q, kind){
  const ans = STATE.answers[q.id];
  const isIdea = kind==='idea';
  const opts = isIdea ? q.ideaOptions : q.titleOptions;
  const selected = isIdea ? ans.idea : ans.title;
  const passage = fullPassageText(q, ans);
  const choices = opts.map((o,i)=>`<div class="choice ${selected===i?'selected':''}" data-i="${i}">${o.text}</div>`).join('');
  return `
    <div class="step-kicker">Step ${isIdea?5:6} of 6</div>
    <h2 class="step-title">${isIdea?'Identify the Main Idea':'Title the Passage'}</h2>
    <div class="instructions">${isIdea?'อ่านบทความแล้วเลือกใจความสำคัญที่ถูกต้องที่สุด':'เลือกชื่อเรื่องที่เหมาะสมที่สุดสำหรับบทความนี้'}</div>
    <div class="passage" style="max-height:220px;overflow:auto;">${passage}</div>
    <div class="choice-list">${choices}</div>
    <div class="action-bar">
      <button class="btn btn-primary" id="nextBtn" ${selected===null||selected===undefined?'disabled':''}>${isIdea?'ถัดไป':'ส่งคำตอบ'}</button>
    </div>
  `;
}

/* ============================================================
   WIRE UP INTERACTIONS
   ============================================================ */
function wireStep(q){
  const ans = STATE.answers[q.id];
  const nextBtn = document.getElementById('nextBtn');

  if(STATE.step===1){
    function refreshNextState(){
      const allFilled = ans.blanks.every(b=>!!b);
      nextBtn.disabled = !allFilled;
    }
    document.querySelectorAll('.blank-btn').forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        document.querySelectorAll('.blank-dropdown').forEach(d=>d.classList.remove('open'));
        const i=btn.dataset.i;
        document.querySelector(`.blank-dropdown[data-i="${i}"]`).classList.add('open');
      });
    });
    document.querySelectorAll('.blank-option').forEach(opt=>{
      opt.addEventListener('mouseenter',()=>{
        const i=opt.dataset.i, val=opt.dataset.val;
        const btn=document.querySelector(`.blank-btn[data-i="${i}"]`);
        btn.textContent = val;
        btn.classList.add('preview');
      });
      opt.addEventListener('mouseleave',()=>{
        const i=opt.dataset.i;
        const btn=document.querySelector(`.blank-btn[data-i="${i}"]`);
        if(!ans.blanks[i]){ btn.textContent='_____'; }
        else { btn.textContent = ans.blanks[i]; }
        btn.classList.remove('preview');
      });
      opt.addEventListener('click',(e)=>{
        e.stopPropagation();
        const i=parseInt(opt.dataset.i,10), val=opt.dataset.val;
        ans.blanks[i]=val;
        const btn=document.querySelector(`.blank-btn[data-i="${i}"]`);
        btn.textContent=val; btn.classList.remove('preview'); btn.classList.add('filled');
        document.querySelector(`.blank-dropdown[data-i="${i}"]`).classList.remove('open');
        refreshNextState();
      });
    });
    document.addEventListener('click', closeDropdowns);
    refreshNextState();
    nextBtn.addEventListener('click', ()=>{ if(!nextBtn.disabled) goNextStep(); });
  }

  if(STATE.step===2){
    document.querySelectorAll('.choice').forEach(c=>{
      c.addEventListener('click',()=>{
        const i=parseInt(c.dataset.i,10);
        ans.insertChoice=i;
        document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
        c.classList.add('selected');
        document.getElementById('insertSlot').textContent = q.insertOptions[i].text;
        document.getElementById('nextBtn').disabled=false;
      });
    });
    if(ans.insertChoice!==null){
      document.getElementById('insertSlot').textContent = q.insertOptions[ans.insertChoice].text;
    }
    nextBtn.addEventListener('click', ()=>{ if(!nextBtn.disabled) goNextStep(); });
  }

  if(STATE.step===3 || STATE.step===4){
    const passageEl = document.getElementById('hlPassage');
    const which = passageEl.dataset.which;
    passageEl.addEventListener('mouseup', ()=>{
      const sel = window.getSelection();
      const text = sel.toString().trim();
      if(text.length>0 && passageEl.contains(sel.anchorNode)){
        ans[which]=text;
        try{
          const range = sel.getRangeAt(0);
          const span = document.createElement('span');
          span.className='hl-user';
          range.surroundContents(span);
        }catch(e){ /* selection spans multiple nodes - ignore visual wrap */ }
        sel.removeAllRanges();
        const statusEl = document.getElementById('hlStatus');
        if(statusEl) statusEl.innerHTML = `คุณเลือกไว้: <b>"${text}"</b>`;
        document.getElementById('nextBtn').disabled=false;
      }
    });
    nextBtn.addEventListener('click', ()=>{ if(!nextBtn.disabled) goNextStep(); });
  }

  if(STATE.step===5 || STATE.step===6){
    const isIdea = STATE.step===5;
    document.querySelectorAll('.choice').forEach(c=>{
      c.addEventListener('click',()=>{
        const i=parseInt(c.dataset.i,10);
        if(isIdea) ans.idea=i; else ans.title=i;
        document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
        c.classList.add('selected');
        document.getElementById('nextBtn').disabled=false;
      });
    });
    nextBtn.addEventListener('click', ()=>{
      if(nextBtn.disabled) return;
      if(STATE.step===6){ finishQuestion(); }
      else { goNextStep(); }
    });
  }
}
function closeDropdowns(){
  document.querySelectorAll('.blank-dropdown').forEach(d=>d.classList.remove('open'));
  document.removeEventListener('click', closeDropdowns);
}

function goNextStep(){
  if(STATE.step < TOTAL_STEPS){
    STATE.step++;
    renderStep();
  }
}

/* ============================================================
   SCORING & RESULTS
   ============================================================ */
function scoreQuestion(q, ans){
  const items=[];
  q.part1.blanks.forEach((b,i)=>{
    const user = ans.blanks[i];
    items.push({
      type:'blank',
      label:`Step 1 · ช่องว่างที่ ${i+1}`,
      correct: user===b.correct,
      userAnswer: user || '(ไม่ได้ตอบ)',
      correctAnswer: b.correct
    });
  });
  const insertCorrectIdx = q.insertOptions.findIndex(o=>o.correct);
  items.push({
    type:'insert',
    label:'Step 2 · ประโยคที่แทรก',
    correct: ans.insertChoice===insertCorrectIdx,
    userAnswer: ans.insertChoice!==null ? q.insertOptions[ans.insertChoice].text : '(ไม่ได้ตอบ)',
    correctAnswer: q.insertOptions[insertCorrectIdx].text
  });
  [ ['hl3',0,'Step 3'], ['hl4',1,'Step 4'] ].forEach(([key,qi,label])=>{
    const user = ans[key];
    items.push({
      type:'highlight',
      label:`${label} · ${q.highlightQs[qi].question}`,
      correct: user ? isHighlightCorrect(user, q.highlightQs[qi].answer) : false,
      userAnswer: user || '(ไม่ได้เลือกข้อความ)',
      correctAnswer: q.highlightQs[qi].answer
    });
  });
  const ideaCorrectIdx = q.ideaOptions.findIndex(o=>o.correct);
  items.push({
    type:'idea',
    label:'Step 5 · Main Idea',
    correct: ans.idea===ideaCorrectIdx,
    userAnswer: ans.idea!==null && ans.idea!==undefined ? q.ideaOptions[ans.idea].text : '(ไม่ได้ตอบ)',
    correctAnswer: q.ideaOptions[ideaCorrectIdx].text
  });
  const titleCorrectIdx = q.titleOptions.findIndex(o=>o.correct);
  items.push({
    type:'title',
    label:'Step 6 · Title',
    correct: ans.title===titleCorrectIdx,
    userAnswer: ans.title!==null && ans.title!==undefined ? q.titleOptions[ans.title].text : '(ไม่ได้ตอบ)',
    correctAnswer: q.titleOptions[titleCorrectIdx].text
  });
  const correctCount = items.filter(i=>i.correct).length;
  const score = (correctCount/items.length)*100;
  return {score, items};
}

function finishQuestion(){
  clearTimer();
  const q = QUESTIONS[STATE.qIndex];
  const ans = STATE.answers[q.id];
  const result = scoreQuestion(q, ans);
  STATE.results[q.id] = result;
  STATE.screen='result';
  renderResult();
}

/* ---- Explanation generator for wrong answers ---- */
function explainMistake(item, q){
  const you = item.userAnswer;
  const correct = item.correctAnswer;
  switch(item.type){
    case 'blank':
      return `คุณเลือก “${you}” แต่คำที่เข้ากับบริบทของประโยคคือ “${correct}” — ลองอ่านประโยคก่อนและหลังช่องว่างให้ครบ เพื่อดูว่าความหมาย ไวยากรณ์ (part of speech) และคำที่มักใช้คู่กัน (collocation) บ่งบอกคำใด<br>
      <span class="study-tag">ควรฝึกเพิ่ม: Vocabulary in Context &amp; Collocation</span>`;
    case 'insert':
      return `ประโยคที่คุณเลือกไม่ได้เชื่อมโยงเนื้อหาระหว่างสองย่อหน้าได้อย่างเป็นเหตุเป็นผล ในขณะที่ประโยคที่ถูกต้องช่วยเชื่อมใจความให้ต่อเนื่อง ลองสังเกต <b>คำเชื่อม</b> (however, therefore, in addition ฯลฯ) และดูว่าประโยคไหน “ขยายความ” หรือ “เชื่อมต่อ” เนื้อหาก่อนหน้าได้ดีที่สุด<br>
      <span class="study-tag">ควรฝึกเพิ่ม: Cohesion &amp; Coherence (การเชื่อมโยงประโยค)</span>`;
    case 'highlight':
      return `ข้อความที่คุณไฮไลต์ไม่ตรงกับสิ่งที่คำถามถาม คำตอบที่ถูกต้องอยู่ที่ “${correct}” ลองอ่านคำถามให้ละเอียดก่อน แล้วค่อยกวาดสายตาหา keyword ที่ตรงกับคำถามในบทความ แทนที่จะเดาจากความจำ<br>
      <span class="study-tag">ควรฝึกเพิ่ม: Scanning (การหาข้อมูลเฉพาะจุด)</span>`;
    case 'idea':
      return `คำตอบที่คุณเลือกน่าจะเป็นเพียง “รายละเอียดย่อย” (supporting detail) ของเรื่อง ไม่ใช่ใจความสำคัญที่ครอบคลุมทั้งบทความ ใจความสำคัญที่แท้จริงคือ “${correct}” ลองถามตัวเองว่า “ถ้าจะเล่าเรื่องนี้ให้คนอื่นฟังในประโยคเดียว จะพูดว่าอะไร”<br>
      <span class="study-tag">ควรฝึกเพิ่ม: Main Idea vs. Supporting Details</span>`;
    case 'title':
      return `ชื่อเรื่องที่คุณเลือกอาจ “แคบเกินไป” (เจาะจงรายละเอียดเดียว) หรือ “กว้างเกินไป” จนไม่ครอบคลุมเนื้อหา ชื่อเรื่องที่เหมาะสมคือ “${correct}” เพราะสรุปแก่นของทั้งบทความได้ครบถ้วนแต่กระชับ<br>
      <span class="study-tag">ควรฝึกเพิ่ม: Summarizing &amp; Title Selection</span>`;
    default:
      return '';
  }
}

function renderResult(){
  const app=document.getElementById('app');
  const q = QUESTIONS[STATE.qIndex];
  const r = STATE.results[q.id];
  const roundedScore = Math.round(r.score);

  const itemsHTML = r.items.map((it,idx)=>`
    <div class="review-item ${it.correct?'ok':'bad'}">
      <div class="review-item-head">
        <div>
          <div class="tag">${it.correct?'ถูกต้อง':'ไม่ถูกต้อง'}</div>
          <div class="q">${it.label}</div>
        </div>
        ${it.correct?'':`<button class="explain-toggle" data-idx="${idx}">อธิบาย <span class="explain-arrow" id="arrow-${idx}">▾</span></button>`}
      </div>
      <div class="ans">คำตอบของคุณ: <b>${it.userAnswer}</b></div>
      ${it.correct?'':`<div class="ans">เฉลย: <b>${it.correctAnswer}</b></div>`}
      ${it.correct?'':`<div class="explain-box" id="explain-${idx}">${explainMistake(it, q)}</div>`}
    </div>
  `).join('');

  const hasNext = SEQUENCE_MODE && STATE.qIndex < QUESTIONS.length-1;
  const isLastOfAll = SEQUENCE_MODE && STATE.qIndex === QUESTIONS.length-1;

  app.innerHTML = `
    <div class="result">
      <div class="result-hero">
        <div class="score">${roundedScore}%</div>
        <div class="label">คะแนนเฉลี่ย · Question ${q.id}: ${q.topic}</div>
      </div>
      <h3>เฉลยอย่างละเอียด</h3>
      ${itemsHTML}
      <div class="result-actions">
        ${hasNext ? `<button class="btn btn-primary" id="nextQBtn">ทำข้อถัดไป (Question ${QUESTIONS[STATE.qIndex+1].id}) →</button>` : ''}
        ${isLastOfAll ? `<button class="btn btn-primary" id="overallBtn">ดูสรุปผลรวมทั้งหมด</button>` : ''}
        <button class="btn btn-outline" id="backMenuBtn">กลับเมนูหลัก</button>
      </div>
    </div>
  `;
  const nextQBtn = document.getElementById('nextQBtn');
  if(nextQBtn) nextQBtn.addEventListener('click', ()=> startQuestion(STATE.qIndex+1, true));
  const overallBtn = document.getElementById('overallBtn');
  if(overallBtn) overallBtn.addEventListener('click', renderOverallSummary);
  document.getElementById('backMenuBtn').addEventListener('click', ()=>{ STATE.screen='menu'; renderMenu(); });
  document.querySelectorAll('.explain-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = btn.dataset.idx;
      const box = document.getElementById(`explain-${idx}`);
      const arrow = document.getElementById(`arrow-${idx}`);
      box.classList.toggle('show');
      arrow.classList.toggle('open');
    });
  });
}

function renderOverallSummary(){
  const app=document.getElementById('app');
  const attempted = Object.keys(STATE.results);
  const avg = Math.round(attempted.reduce((s,id)=>s+STATE.results[id].score,0)/attempted.length);
  const rows = QUESTIONS.map(q=>{
    const r = STATE.results[q.id];
    return `<div class="review-item ${r && r.score>=60?'ok':'bad'}">
      <div class="q">Question ${q.id}: ${q.topic}</div>
      <div class="ans">คะแนน: <b>${r?Math.round(r.score):0}%</b></div>
    </div>`;
  }).join('');
  app.innerHTML = `
    <div class="result">
      <div class="result-hero">
        <div class="score">${avg}%</div>
        <div class="label">คะแนนเฉลี่ยรวมทั้ง 6 ข้อ</div>
      </div>
      ${rows}
      <div class="result-actions">
        <button class="btn btn-primary" id="backMenuBtn2">กลับเมนูหลัก</button>
      </div>
    </div>
  `;
  document.getElementById('backMenuBtn2').addEventListener('click', ()=>{ STATE.screen='menu'; renderMenu(); });
}

/* ============================================================
   INIT
   ============================================================ */
renderMenu();
</script>
